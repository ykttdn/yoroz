version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 */3 * *"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    groups:
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 */3 * *"
    cooldown:
      default-days: 7
